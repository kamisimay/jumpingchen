<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジャンピング橙シミュレーター</title>
    <style>
        body { margin: 0; padding: 0; background-color: #e6a76a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        canvas { background-color: #f7bd83; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
<canvas id="simCanvas" width="500" height="600"></canvas>
<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const GRAVITY = 0.4;
const RARE_CHANCE = 1 / 256; // ran.png に変わる確率
const MAX_CHARACTERS = 100;  // 同時に表示できる最大数（負荷対策）
const SIZE = 180;

// 画像を読み込み、白背景を透過処理したcanvasを一度だけ作って保存する
function loadSprite(src) {
    const sprite = { canvas: null, isLoaded: false };
    const img = new Image();
    img.onload = () => {
        const c = document.createElement('canvas');
        c.width = img.width; c.height = img.height;
        const cctx = c.getContext('2d');
        cctx.drawImage(img, 0, 0);
        const imgData = cctx.getImageData(0, 0, c.width, c.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            if (data[i] > 240 && data[i + 1] > 240 && data[i + 2] > 240) data[i + 3] = 0;
        }
        cctx.putImageData(imgData, 0, 0);
        sprite.canvas = c;
        sprite.isLoaded = true;
    };
    img.src = src;
    return sprite;
}

const sprites = {
    chen: loadSprite('chen.png'),
    ran: loadSprite('ran.png')
};

// 画面内にいるキャラクターの一覧（タップするたびに増える）
const characters = [];

function launchCharacter() {
    if (characters.length >= MAX_CHARACTERS) return;

    const padding = SIZE / 2;
    const groundY = canvas.height + padding;
    const vy = -16 - Math.random() * 5; // 高さランダム

    // 回転数ランダム（1〜5回転、向きもランダム）
    // 滞空時間 = 2*|vy|/重力 フレーム。その間にちょうど整数回転して着地する
    const rotations = 1 + Math.floor(Math.random() * 5);
    const direction = Math.random() < 0.5 ? -1 : 1;
    const flightFrames = 2 * Math.abs(vy) / GRAVITY;

    characters.push({
        x: padding + Math.random() * (canvas.width - padding * 2),
        y: groundY,
        vx: (Math.random() - 0.5) * 5,
        vy: vy,
        angle: 0,
        spin: direction * rotations * Math.PI * 2 / flightFrames,
        // 1/256 で ran.png に変更
        sprite: (Math.random() < RARE_CHANCE) ? sprites.ran : sprites.chen
    });
}

canvas.addEventListener('touchstart', (e) => { e.preventDefault(); launchCharacter(); }, false);
canvas.addEventListener('mousedown', () => { launchCharacter(); });

function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = characters.length - 1; i >= 0; i--) {
        const ch = characters[i];
        ch.vy += GRAVITY;
        ch.x += ch.vx;
        ch.y += ch.vy;
        ch.angle += ch.spin;

        // 落ちて画面の外に出たら削除
        if (ch.vy > 0 && ch.y > canvas.height + SIZE / 2 + 50) {
            characters.splice(i, 1);
        }
    }

    for (const ch of characters) {
        if (!ch.sprite.isLoaded) continue;
        ctx.save();
        ctx.translate(ch.x, ch.y);
        ctx.rotate(ch.angle);
        ctx.drawImage(ch.sprite.canvas, -SIZE / 2, -SIZE / 2, SIZE, SIZE);
        ctx.restore();
    }

    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)'; ctx.font = '20px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('タップで橙が出るよ', canvas.width / 2, 40);
    requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
